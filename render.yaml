services:
  - type: web
    name: accounts-tracker
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.18.0
      # Lifetime data: set this in Render Dashboard to a Neon/Supabase Postgres URL.
      # Without DATABASE_URL, Render uses temporary SQLite (data can reset on redeploy).
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
